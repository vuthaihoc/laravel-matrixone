# Standalone MatrixOne whose table data lives on S3 / MinIO.
# Edit the [fileservice.s3] sections in ./etc/*.toml first, then:
#   docker compose up -d
services:
  matrixone:
    image: matrixorigin/matrixone:${MATRIXONE_TAG:-4.2.4}
    container_name: matrixone-s3
    # The log service stores its data under a directory named after the
    # hostname. Keep it fixed, or a re-created container fails to start
    # with "shard not bootstrapped".
    hostname: matrixone
    # The image launches /etc/quickstart/launch.toml (local disk only);
    # point it at the S3 configuration mounted from ./etc instead.
    entrypoint:
      - /mo-service
      - -debug-http=:12345
      - -launch
      - /mo_confs/launch.toml
    ports:
      - "6001:6001"
      # Cluster-internal ports for a compute node on another host (remote-cn/):
      # HAKeeper, TN (txn, logtail, lock) and this CN (pipeline, lock, query,
      # gossip; gossip also over UDP). They have no authentication: bound to
      # loopback unless MATRIXONE_CLUSTER_IP names a private address of this host.
      - "${MATRIXONE_CLUSTER_IP:-127.0.0.1}:32001:32001"
      - "${MATRIXONE_CLUSTER_IP:-127.0.0.1}:19000-19002:19000-19002"
      - "${MATRIXONE_CLUSTER_IP:-127.0.0.1}:18000-18003:18000-18003"
      - "${MATRIXONE_CLUSTER_IP:-127.0.0.1}:18003:18003/udp"
    volumes:
      # launch.toml, cn.toml, tn.toml and log.toml
      - ./etc:/mo_confs:ro
      # Must persist: the log service WAL and TN state stay on local disk.
      # Losing this directory leaves the data on S3 unusable.
      - ./mo-data:/mo-data
      # Local disk cache for the S3 data.
      - ./mo-cache:/mo-cache
    restart: unless-stopped

  # Optional second compute node (manual scale-out), off by default:
  #   docker compose --profile scale up -d
  # It finds the cluster through HAKeeper at matrixone:32001 and serves SQL on
  # 127.0.0.1:6002. See docs/docs/docker.md, "Adding compute nodes".
  cn2:
    image: matrixorigin/matrixone:${MATRIXONE_TAG:-4.2.4}
    container_name: matrixone-cn2
    profiles: [scale]
    depends_on:
      - matrixone
    entrypoint:
      - /mo-service
      - -cfg
      - /mo_confs/cn.toml
    ports:
      - "6002:6002"
      # Lets a compute node on another host reach this CN (see above).
      - "${MATRIXONE_CLUSTER_IP:-127.0.0.1}:18100-18103:18100-18103"
      - "${MATRIXONE_CLUSTER_IP:-127.0.0.1}:18103:18103/udp"
    volumes:
      - ./cn2/etc:/mo_confs:ro
      # Temporary files only: a CN keeps no data of its own.
      - ./cn2/mo-data:/mo-data
      - ./cn2/mo-cache:/mo-cache
    restart: unless-stopped
