# A second compute node (CN) joining the "matrixone" service: started with
#   docker compose --profile scale up -d
# It reads the same SHARED data on S3; only uuid, addresses and ports differ.
service-type = "CN"
data-dir = "/mo-data"

[log]
level = "info"

[cn]
# Unique per CN.
uuid = "dd1dccb4-4d3c-41f8-b482-5251dc7a41c2"
port-base = 18100
# How the other services reach this CN: its compose service name.
service-host = "cn2"
sql-address = "cn2:6002"

[cn.frontend]
port = 6002

[malloc]
check-fraction = 65536
enable-metrics = true

[observability]
disableMetric = false
enable-metric-to-prom = true
status-port = 7001

# LOCAL: temporary files, one directory per service.
[[fileservice]]
name = "LOCAL"
backend = "DISK"
data-dir = "/mo-data/local/cn2"

# SHARED: MatrixOne table data, stored on S3.
# backend = "MINIO" for MinIO, "S3" for AWS S3 and other S3-compatible
# services (Tencent COS, Alibaba OSS...).
[[fileservice]]
name = "SHARED"
backend = "MINIO"

[fileservice.cache]
memory-capacity = "1GiB"
disk-capacity = "10GiB"
disk-path = "/mo-cache/cn2"

[fileservice.s3]
endpoint = "https://minio.example.com"
bucket = "matrixone"
key-prefix = "mo/data"
region = "us-east-1"
key-id = "YOUR_ACCESS_KEY"
key-secret = "YOUR_SECRET_KEY"

# ETL: observability data, same bucket with another prefix.
[[fileservice]]
name = "ETL"
backend = "MINIO"

[fileservice.cache]
memory-capacity = "1B"

[fileservice.s3]
endpoint = "https://minio.example.com"
bucket = "matrixone"
key-prefix = "mo/etl"
region = "us-east-1"
key-id = "YOUR_ACCESS_KEY"
key-secret = "YOUR_SECRET_KEY"

# The cluster is found through HAKeeper, in the log service of "matrixone".
[hakeeper-client]
service-addresses = ["matrixone:32001"]
